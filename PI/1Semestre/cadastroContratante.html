<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="global/global.css">
    <link rel="icon" type="image/png" href="logos/favicon.png">
    <link rel="stylesheet" href="formulario.css">
    <title>Cadastro de Contratante</title>
</head>

<body>

    <div id="header"></div>
    <div id="menu"></div>

    <div class="container">

        <h1>Cadastre seu Local</h1>

        <form>

            <div class="linha">
                <input type="text" placeholder="Nome do Local">

                <input type="text" placeholder="CEP">

                <select>
                    <option>Cidade</option>
                    <option>Franca</option>
                    <option>Ribeirão Preto</option>
                    <option>São Paulo</option>
                </select>
            </div>

            <div class="linha">

                <input type="text" placeholder="Endereço: (Rua, Número, Bairro.)">

                <select>
                    <option>Estado</option>
                    <option>SP</option>
                    <option>MG</option>
                    <option>RJ</option>
                </select>

            </div>

            <div class="linha">

                <div class="instrumentos">
                    <label>Possui Equipamentos ?</label>

                    <div class="radio-group">
                        <input type="radio" id="sim" name="instrumentos">
                        <label for="sim">Sim</label>

                        <input type="radio" id="nao" name="instrumentos">
                        <label for="nao">Não</label>
                    </div>
                </div>

                <div class="redes-sociais">
                    <label>Redes Sociais</label>

                    <div class="redes">
                        <input type="text" placeholder="YouTube">
                        <input type="text" placeholder="Facebook">
                        <input type="text" placeholder="Instagram">
                    </div>
                </div>

            </div>

            <div class="botoes">
                <button type="button" class="voltar" onclick="window.location.href='cadastro.html'">
                    Voltar
                </button>

                <button type="submit">
                    Cadastrar
                </button>
            </div>


        </form>

    </div>

    <div id="footer"></div>

    <script>
        fetch("global/header.html")
            .then(res => res.text())
            .then(data => {
                document.getElementById("header").innerHTML = data;
            });

        fetch("global/footer.html")
            .then(res => res.text())
            .then(data => {
                document.getElementById("footer").innerHTML = data;
            });

        fetch("global/menuSimples.html")
            .then(res => res.text())
            .then(data => {
                document.getElementById("menu").innerHTML = data;
            });
    </script>

</body>

</html>
